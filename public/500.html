<!doctype html>
<html lang="en">
<head>
  <title>Something went wrong — Kitatoo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: #F1EDE6;
      font-family: "Onest", sans-serif;
      color: #16130F;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .error-code {
      font-family: "Syne", sans-serif;
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #FF6B35;
    }

    .error-title {
      font-family: "Syne", sans-serif;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 12px;
      color: #16130F;
    }

    .error-text {
      font-size: 15px;
      line-height: 24px;
      color: #6E675E;
      max-width: 360px;
      margin-top: 12px;
    }

    .error-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 32px;
      padding: 0 28px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: #16130F;
      color: #FBF9F5;
      font-family: "Onest", sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms ease;
    }

    .error-link:hover {
      background: #2E2A24;
    }
  </style>
</head>
<body>
  <div class="error-code">500</div>
  <h1 class="error-title">Something went wrong</h1>
  <p class="error-text">We're sorry, an unexpected error occurred. Please try again later.</p>
  <a href="/" class="error-link">Back to home</a>
</body>
</html>
