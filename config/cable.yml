# solid_cable (DB-backed, single connection here since dev has no separate cable
# database) so broadcasts from the Solid Queue worker process reach the Puma
# process holding the browser's WebSocket connection.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
